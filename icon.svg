<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer App Container -->
  <rect width="512" height="512" rx="120" fill="#090D16"/>
  <rect x="36" y="36" width="440" height="440" rx="92" fill="#131B2E" stroke="#25334D" stroke-width="6"/>
  
  <!-- Cocktail Liquid (Cyan) -->
  <polygon points="194,240 318,240 256,310" fill="#0ea5e9"/>
  <polygon points="204,240 308,240 256,298" fill="#38bdf8" opacity="0.4"/>

  <!-- Glass Stem & Base (Light Slate / Glass look) -->
  <rect x="250" y="310" width="12" height="90" rx="4" fill="#94A3B8"/>
  <rect x="206" y="394" width="100" height="12" rx="6" fill="#94A3B8"/>
  
  <!-- Glass Bowl Outline -->
  <path d="M146 180 L256 310 L366 180 Z" fill="none" stroke="#CBD5E1" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="140" y1="180" x2="372" y2="180" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>

  <!-- Cocktail Pick (Diagonal through glass) -->
  <line x1="180" y1="130" x2="300" y2="250" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>

  <!-- Olive Garnish (Speared on pick) -->
  <g transform="translate(230, 180) rotate(-45)">
    <!-- Olive Body -->
    <ellipse cx="0" cy="0" rx="22" ry="16" fill="#65a30d" stroke="#4d7c0f" stroke-width="3"/>
    <!-- Pimento Center -->
    <circle cx="0" cy="0" r="6" fill="#ef4444"/>
  </g>
</svg>
